controller_manager:
  ros__parameters:
    update_rate: 30
  
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_attack_pinion_joint"]
    right_wheel_names: ["right_attack_pinion_joint"]

    wheel_radius: 0.09
    wheel_separation: 0.49 #0.4 + 0.045 + 0.045
    wheel_separation_multiplier: 1.0
    wheel_radius_multiplier: 1.0

    open_loop: true # Las ruedas no tienen encoders
    enable_odom_tf: false # El odom lo publica robot_localization
    position_feedback: false

    odom_frame_id: "odom_ros2_control" # Para evitar que se superponga al odom de robot_localization
    base_frame_id: "base_link"

    linear.x.max_velocity: 1.0 #m/s
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 2.0
    linear.x.max_deceleration: 2.0

    angular.z.max_velocity: 1.0 #radianes/s
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 2.0
    angular.z.max_deceleration: 2.0
